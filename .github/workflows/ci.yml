name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: pip install -e ".[dev]"
      - run: npm install -g jscpd
      - run: bash scripts/setup.sh  # fetches tools/code-maat.jar for churn.py

      # gitleaks/semgrep/osv-scanner/staticcheck are deliberately not
      # installed here: every test that would exercise them either
      # monkeypatches the tool call to verify this repo's own parsing
      # logic (test_security.py), or exercises only the "tool not
      # installed" skip path (test_lint_quality.py's staticcheck tests) --
      # see AGENTS.md's testing philosophy. Tests needing a real binary
      # that isn't installed skip themselves explicitly (pytest.mark.skipif),
      # they don't silently pass.
      - name: Run tests with coverage
        run: pytest --cov=repo_analyser --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
